name: svs_timestamp
description: SVS TimeStamp - capture photos stamped with time, location, logo and more.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  camera: ^0.10.0+1
  geolocator: ^9.0.2
  permission_handler: ^11.3.1
  path_provider: ^2.0.15
  intl: any
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  image: ^4.6.0
  geocoding: ^4.0.0
  image_picker: ^1.2.1
  share_plus: ^7.0.2
  shared_preferences: ^2.5.4
  google_fonts: ^4.0.4
  photo_view: ^0.14.0
  fluttertoast: ^8.2.2  # For toast messages
  gallery_saver_plus: ^3.2.9
  hive_flutter: ^1.1.0
  vibration: ^3.1.5
  quick_actions: ^1.1.0
  geocoding_ios: ^3.1.0
  google_maps_flutter: ^2.14.2
  native_device_orientation: ^2.1.0
  flutter_animate: ^4.5.2
  file_picker: ^10.3.10
  photo_manager: ^3.9.0
  device_info_plus: ^12.3.0
  camerawesome: ^2.5.0
  sensors_plus: ^7.0.0
  open_filex: ^4.7.0

  # gallery_saver: ^2.3.2

# dependency_overrides:
#   image_gallery_saver:
#     git:
#       url: https://github.com/hui-z/image_gallery_saver.git
#       ref: master



dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_launcher_icons: "^0.13.1"

  flutter_lints: ^5.0.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # image_path: "assets/sv_app_icon.png"
  # image_path: "assets/sv_super_app_icon.png"
  image_path: "assets/image.png"
  
  # min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/KantumruyPro-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/

